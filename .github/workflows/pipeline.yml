name: Pipeline CI - Registro de Notas

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install pytest pytest-bdd pytest-cov

      - name: Ejecutar tests unitarios
        run: pytest tests/test_registro_notas.py -v

      - name: Ejecutar tests BDD
        run: pytest tests/features/steps/steps_notas.py -v

      - name: Reporte de cobertura
        run: pytest tests/test_registro_notas.py --cov=src --cov-report=term-missing --cov-fail-under=85